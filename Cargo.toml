[package]
name = "foody"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = "1.0.228"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
anyhow = "1.0.102"
dotenv = "0.15.0"
rand = "0.10.1"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.5"
directories = "6.0.0"
cel = "0.13.0"
